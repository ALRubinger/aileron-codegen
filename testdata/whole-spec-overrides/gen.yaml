# `teams` uses every default (Query → idempotent, no approval).
# `issueMarkAsRead` overrides both idempotent and approval — by default
# it would be non-idempotent + approval-required (Mutation), but it's
# reversible client-side so we relax both.
connector:
  endpoint: "https://example.com/graphql"
  name: "github://example/connector-overrides"
  credential:
    kind: "api_key"

operations:
  issueMarkAsRead:
    idempotent: true
    approval: none
